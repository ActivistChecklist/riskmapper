name: CI

# Lint, typecheck, build and test every pull request, including Dependabot's,
# so dependency updates can be merged on a green check instead of checked
# out by hand.
#
# Not in the trust path, like webcat-verify.yml: no secrets, a read-only
# token, and nothing it produces is deployed or signed. Signing stays local
# (MIGRATION.md D1). That also contains a malicious dependency in a PR: its
# install scripts run here with nothing to steal and nothing to write to.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      # With a cold yarn cache, which every lockfile change brings, this can
      # fail with "Extracting tar content ... failed, the file appears to be
      # corrupt". Yarn builds the umami-extra-privacy git dependency with a
      # second install that shares the cache, and the two can unpack the same
      # package at once. The retry fetches one package at a time, so that
      # second install runs alone. Most packages are cached by then, so it
      # takes seconds.
      - run: yarn install --frozen-lockfile || yarn install --frozen-lockfile --network-concurrency 1
      - run: yarn lint
      - run: yarn typecheck
      # Before tests: server/securityHeaders.test.ts runs the built server.
      - run: yarn build
      - run: yarn test
