<!doctype html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Head tags are hand-written here rather than generated, and are
         pinned by app/layout.metadata.test.ts. Keep the two in step. -->
    <title>Risk Mapper</title>
    <meta
      name="description"
      content="A risk mapping tool for planning strategic action: name risks, place them by impact and likelihood, and choose mitigations."
    />

    <!-- Defense-in-depth so a share URL of the form `/grid/<id>#<key>`
         cannot leak the fragment via Referer headers on subresource
         fetches. The fragment is never sent in HTTP request lines, but a
         strict referrer policy further reduces the surface area for
         accidental disclosure. -->
    <meta name="referrer" content="no-referrer" />

    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icon-48.png" sizes="48x48" type="image/png" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="icon" href="/icon-512.png" sizes="512x512" type="image/png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-icon.png" sizes="180x180" type="image/png" />

    <!-- Blocking and external: sets `.dark` on <html> before first paint.
         Must stay non-async and non-defer, and must stay a separate file
         rather than inline. See public/theme-boot.js and MIGRATION.md. -->
    <script src="/theme-boot.js"></script>
  </head>
  <body class="flex min-h-full flex-col">
    <div id="root" class="flex min-h-full flex-col"></div>
    <script type="module" src="/client/main.tsx"></script>
  </body>
</html>
